[project]
name = "localdocsai"
version = "0.1.0"
description = "Offline RAG system for querying normative and technical documents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sergio Osorio" }]
requires-python = ">=3.11"
keywords = ["rag", "llm", "offline", "documents", "normative"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Document parsers (always required)
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # Configuration (always required)
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# Phase 3 — vector indexing
ml = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
]
# Phase 4 — LLM inference
llm = [
    "llama-cpp-python>=0.3.0",
]
# Phase 6 — desktop UI
ui = [
    "PySide6>=6.7.0",
]
# Phase 7 — report generation
reports = [
    "reportlab>=4.2.0",
]
# Full install (all optional features)
all = [
    "localdocsai[ml,llm,ui,reports]",
]
# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
localdocsai = "localdocsai.__main__:main"

[project.urls]
Homepage = "https://github.com/Sergio-Osorio09/LocalDocsAI"
Repository = "https://github.com/Sergio-Osorio09/LocalDocsAI"
Issues = "https://github.com/Sergio-Osorio09/LocalDocsAI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localdocsai"]

# =============================================================================
# Ruff — linting
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["localdocsai"]

# =============================================================================
# Black — formatting
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]

# =============================================================================
# Mypy — type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/localdocsai"]

# PySide6 has no type stubs and its classes resolve to Any when not installed.
# Skip errors in UI modules that subclass Qt widgets — _markdown.py is pure Python
# and tested directly, so it still benefits from mypy via the test suite import.
[[tool.mypy.overrides]]
module = [
    "localdocsai.ui.main_window",
    "localdocsai.ui.sidebar",
    "localdocsai.ui.topbar",
    "localdocsai.ui.chat_area",
    "localdocsai.ui.composer",
    "localdocsai.ui.sources_panel",
    "localdocsai.ui.icons",
    "localdocsai.ui",
    "localdocsai.ui.dialogs.folder_manager",
    "localdocsai.ui.dialogs.settings_dialog",
    "localdocsai.ui.dialogs.export_dialog",
    "localdocsai.ui.dialogs.pdf_viewer",
    "localdocsai.ui.dialogs.report_editor",
]
ignore_errors = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
