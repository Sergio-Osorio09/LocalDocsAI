[project]
name = "localdocsai"
version = "0.1.0"
description = "Offline RAG system for querying normative and technical documents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sergio Osorio" }]
requires-python = ">=3.11"
keywords = ["rag", "llm", "offline", "documents", "normative"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Document parsers
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # Embeddings and vector search
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    # LLM runtime
    "llama-cpp-python>=0.3.0",
    # UI
    "PySide6>=6.7.0",
    # Configuration
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    # Report generation
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
localdocsai = "localdocsai.__main__:main"

[project.urls]
Homepage = "https://github.com/Sergio-Osorio09/LocalDocsAI"
Repository = "https://github.com/Sergio-Osorio09/LocalDocsAI"
Issues = "https://github.com/Sergio-Osorio09/LocalDocsAI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localdocsai"]

# =============================================================================
# Ruff — linting
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["localdocsai"]

# =============================================================================
# Black — formatting
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]

# =============================================================================
# Mypy — type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/localdocsai"]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
